<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Loading Bay Monitor</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--green:#3fb950;--green-bg:#3fb95020;--amber:#d29922;--amber-bg:#d2992220;--red:#f85149;--red-bg:#f8514920;--gray:#484f58}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:var(--bg);color:var(--text);padding:12px;min-height:100dvh}
/* --- transitions --- */
.cam-card{transition:border-color .4s,box-shadow .4s}
.badge{transition:background .4s,color .4s,border-color .4s}
.truck-label{transition:color .4s}
.status-dot{transition:background .4s,box-shadow .4s}
.progress-bar{transition:width .5s ease,background .4s}
.meta-dot{transition:background .4s}
/* --- state colors --- */
.cam-card.state-active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-bg)}
.cam-card.state-locked{border-color:var(--green);box-shadow:0 0 0 1px var(--green-bg)}
.cam-card.state-idle{border-color:var(--border)}
.badge-locked{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.badge-scanning{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber)}
.badge-idle{background:transparent;color:var(--text2);border:1px solid var(--gray)}
.truck-label.confirmed{color:var(--green)}
.truck-label.detected{color:var(--amber)}
.truck-label.away{color:var(--red)}
.truck-label.idle{color:var(--text2)}
.status-dot.green{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.amber{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.status-dot.red{background:var(--red);box-shadow:0 0 6px var(--red)}
.status-dot.gray{background:var(--gray)}
.progress-bar.green{background:var(--green)}
.progress-bar.amber{background:var(--amber)}
.progress-bar.red{background:var(--red)}
.meta-dot.on{background:var(--green)}
.meta-dot.off{background:var(--gray)}
/* --- header --- */
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px}
.header h1{font-size:1.25rem;font-weight:600;display:flex;align-items:center;gap:8px}
.header h1 .logo{width:26px;height:26px;background:var(--green);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.header-stats{display:flex;gap:8px;font-size:.75rem;color:var(--text2);flex-wrap:wrap}
.header-stats span{display:flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:3px 10px;white-space:nowrap;transition:border-color .4s}
.stat-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;transition:background .4s}
/* --- stream --- */
.stream-section{margin-bottom:12px}
.stream-wrap{background:var(--surface);border-radius:10px;overflow:hidden;position:relative;aspect-ratio:16/9;max-height:70vh;border:1px solid var(--border)}
.stream-wrap img{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.stream-overlay{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:8px 10px;pointer-events:none;gap:8px}
.stream-badge{background:#0d1117;border:1px solid var(--border);padding:3px 12px;border-radius:5px;font-size:.75rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;transition:border-color .4s}
.stream-fps{background:#0d1117;border:1px solid var(--border);padding:3px 10px;border-radius:5px;font-size:.7rem;font-family:monospace;color:var(--green);white-space:nowrap;flex-shrink:0}
/* --- cam grid --- */
.cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.cam-card{background:var(--surface);border-radius:8px;border:1px solid var(--border);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px;gap:6px}
.card-name{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badge{font-size:.58rem;font-weight:600;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
.card-body{padding:2px 12px 10px}
.truck-row{display:flex;align-items:center;gap:7px;font-size:.82rem;padding:3px 0}
.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.truck-label{font-weight:600;font-size:.82rem}
.truck-label .ctr{font-weight:400;font-size:.7rem;color:var(--text2)}
.progress-wrap{height:3px;background:var(--surface2);border-radius:2px;margin:3px 0;overflow:hidden}
.progress-bar{height:100%;border-radius:2px}
.meta-row{display:flex;gap:10px;font-size:.68rem;color:var(--text2);padding-top:3px;flex-wrap:wrap}
.meta-row span{display:flex;align-items:center;gap:2px;transition:color .4s}
.meta-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
/* --- responsive --- */
@media(max-width:480px){body{padding:8px}.header h1{font-size:1rem}.header h1 .logo{width:22px;height:22px;font-size:12px}.header-stats{font-size:.68rem;gap:5px}.header-stats span{padding:2px 7px}.cam-grid{grid-template-columns:1fr}.stream-badge{font-size:.65rem;max-width:60%}.stream-fps{font-size:.6rem}}
@media(min-width:481px)and (max-width:768px){body{padding:10px}.cam-grid{grid-template-columns:1fr 1fr}}
@media(min-width:769px)and (max-width:1024px){.cam-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="header">
<h1><span class="logo">&#9632;</span> Loading Bay</h1>
<div class="header-stats">
<span id="statOnline"><span class="stat-dot" style="background:var(--green)"></span> Online</span>
<span id="statScan"><span class="stat-dot" style="background:var(--amber)"></span> Scanning: 0</span>
<span id="statLock"><span class="stat-dot" style="background:var(--green)"></span> Locked: 0</span>
<span id="statTrucks"><span class="stat-dot" style="background:var(--green)"></span> Trucks: 0</span>
</div>
</div>
<div class="stream-section">
<div class="stream-wrap">
<img src="/stream" alt="Live feed">
<div class="stream-overlay">
<div class="stream-badge" id="streamLabel">Connecting...</div>
<div class="stream-fps" id="streamFps">-- fps</div>
</div>
</div>
</div>
<div class="cam-grid" id="camGrid"></div>
<script>
const R_PRES=100,R_MISS=60;
const G=document.getElementById('camGrid'),SL=document.getElementById('streamLabel'),SF=document.getElementById('streamFps');
const SON=document.getElementById('statOnline'),SCN=document.getElementById('statScan'),LCK=document.getElementById('statLock'),TRK=document.getElementById('statTrucks');

// Store per-card element references to avoid full-DOM rebuild on each poll
let cardRefs = [];

function initCards(names) {
  cardRefs = names.map((name, i) => {
    const card = document.createElement('div');
    card.className = 'cam-card';
    card.innerHTML =
      '<div class="card-head"><span class="card-name">' + name + '</span><span class="badge" id="bg' + i + '">Standby</span></div>' +
      '<div class="card-body">' +
        '<div class="truck-row"><span class="status-dot" id="dt' + i + '"></span><span class="truck-label" id="lb' + i + '">Waiting</span></div>' +
        '<div class="progress-wrap"><div class="progress-bar" id="pb' + i + '" style="width:0%"></div></div>' +
        '<div class="meta-row"><span><span class="meta-dot" id="md' + i + '"></span> Motion</span><span id="mtr' + i + '">Present: 0</span><span id="mtr2' + i + '">Missing: 0</span></div>' +
      '</div>';
    G.appendChild(card);
    return {
      el: card,
      badge: document.getElementById('bg' + i),
      dot: document.getElementById('dt' + i),
      label: document.getElementById('lb' + i),
      bar: document.getElementById('pb' + i),
      mdot: document.getElementById('md' + i),
      m1: document.getElementById('mtr' + i),
      m2: document.getElementById('mtr2' + i)
    };
  });
}

function updateCards(cameras) {
  for (let i = 0; i < cameras.length; i++) {
    const c = cameras[i];
    const r = cardRefs[i];
    if (!r) continue;

    // State (border color)
    let st = 'idle', bc = 'badge-idle', bt = 'Standby';
    if (c.locked) { st = 'locked'; bc = 'badge-locked'; bt = 'Locked'; }
    else if (c.active) { st = 'active'; bc = 'badge-scanning'; bt = 'Scanning'; }
    r.el.className = 'cam-card state-' + st;
    r.badge.className = 'badge ' + bc;
    r.badge.textContent = bt;

    // Truck status — show idle when camera is on standby (not active, not locked)
    let tc = 'idle', tt = 'Waiting', dc = 'gray', pp = 0, pc = 'amber';
    if (c.locked || c.active) {
      if (c.truck_in_zone) { tc = 'confirmed'; tt = 'Confirmed'; dc = 'green'; pp = 100; pc = 'green'; }
      else if (c.consecutive_present > 0) { tc = 'detected'; tt = 'Detecting'; dc = 'amber'; pp = Math.min(100, c.consecutive_present / R_PRES * 100); pc = 'amber'; }
      else if (c.consecutive_missing > 0) { tc = 'away'; tt = 'Away'; dc = 'red'; pp = Math.min(100, c.consecutive_missing / R_MISS * 100); pc = 'red'; }
    }
    r.dot.className = 'status-dot ' + dc;
    let ctr = '';
    if (c.locked || c.active) {
      ctr = c.truck_in_zone ? '100%' : c.consecutive_present > 0 ? c.consecutive_present + '/' + R_PRES : c.consecutive_missing > 0 ? c.consecutive_missing + '/' + R_MISS : '';
    }
    r.label.className = 'truck-label ' + tc;
    r.label.innerHTML = tt + (ctr ? ' <span class="ctr">' + ctr + '</span>' : '');
    r.bar.className = 'progress-bar ' + pc;
    r.bar.style.width = pp + '%';

    // Motion + meta
    r.mdot.className = 'meta-dot ' + (c.has_motion ? 'on' : 'off');
    r.m1.textContent = 'Present: ' + c.consecutive_present;
    r.m2.textContent = 'Missing: ' + c.consecutive_missing;
  }
}

// On first poll response, build DOM once; subsequent polls only update properties
let built = false;

async function poll() {
  try {
    const r = await fetch('/status');
    const t = await r.text();
    const s = JSON.parse(t);

    // Stream
    const a = s.cameras[s.active_idx];
    const f = s.focused_idx !== null ? s.cameras[s.focused_idx] : null;
    SL.textContent = f ? 'Locked - ' + f.name : a ? 'Scanning - ' + a.name : '--';
    SF.textContent = s.fps + ' fps';

    // Header stats
    let sc = 0, lc = 0, tc = 0;
    s.cameras.forEach(c => { if (c.locked) lc++; else if (c.active) sc++; if (c.truck_in_zone) tc++; });
    SCN.textContent = 'Scanning: ' + sc;
    LCK.textContent = 'Locked: ' + lc;
    TRK.textContent = 'Trucks: ' + tc;

    // Camera cards — build once, update thereafter
    if (!built) {
      initCards(s.cameras.map(c => c.name));
      built = true;
    }
    updateCards(s.cameras);

    // Online dot: green when data flows
    SON.innerHTML = '<span class="stat-dot" style="background:var(--green)"></span> Online';
  } catch (e) {
    SON.innerHTML = '<span class="stat-dot" style="background:var(--red)"></span> Offline';
  }
  setTimeout(poll, 1000);
}

poll();
</script>
</body>
</html>
